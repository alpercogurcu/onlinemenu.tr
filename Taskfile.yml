version: '3'

dotenv: ['backend/.env']

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  web:
    taskfile: ./web/Taskfile.yml
    optional: true
  mobile:
    taskfile: ./mobile/Taskfile.yml
    optional: true

tasks:
  dev:
    desc: "Tüm stack'i başlat (compose + backend hot-reload)"
    deps: [compose:up]
    cmds:
      - task: backend:dev

  compose:up:
    desc: "docker-compose.dev.yml'deki tüm servisleri başlat (core+auth+storage+observability)"
    cmds:
      - docker compose -f deploy/docker-compose.dev.yml --profile core --profile auth --profile storage --profile observability up -d

  compose:up:core:
    desc: "Yalnızca core servisleri başlat (postgres, redis, nats, vault)"
    cmds:
      - docker compose -f deploy/docker-compose.dev.yml --profile core up -d

  compose:down:
    desc: "Dev servislerini durdur"
    cmds:
      - docker compose -f deploy/docker-compose.dev.yml down

  compose:logs:
    desc: "Dev servis loglarını izle"
    cmds:
      - docker compose -f deploy/docker-compose.dev.yml logs -f

  web:dev:
    desc: "Admin paneli dev server (Next.js)"
    dir: web/apps/admin
    cmds:
      - pnpm dev

  web:build:
    desc: "Admin paneli production build"
    dir: web
    cmds:
      - pnpm build

  web:install:
    desc: "Frontend bağımlılıklarını kur (tüm workspace)"
    dir: web
    cmds:
      - pnpm install

  web:lint:
    desc: "Frontend lint (CI ile aynı komut: web kökünde pnpm run lint)"
    dir: web
    cmds:
      - pnpm run lint

  web:typecheck:
    desc: "Admin paneli tip kontrolü (tsc --noEmit)"
    dir: web/apps/admin
    cmds:
      - pnpm typecheck

  web:test:
    desc: Admin paneli testleri (vitest — hook/component)
    dir: web/apps/admin
    cmds:
      - pnpm run test:run

  web:e2e:
    desc: "Rol bazlı Playwright e2e (yığın ayakta olmalı: compose + API :8081 + admin :3000; E2E_BASE_URL ile port değişir)"
    dir: web/apps/admin
    cmds:
      - pnpm run e2e

  menu:dev:
    desc: "Misafir QR menü uygulaması dev server (Next.js, :3001)"
    dir: web/apps/menu
    cmds:
      - pnpm dev

  menu:build:
    desc: "Misafir QR menü uygulaması production build"
    dir: web
    cmds:
      - pnpm --filter @onlinemenu/menu build

  menu:typecheck:
    desc: "Misafir QR menü uygulaması tip kontrolü (tsc --noEmit)"
    dir: web/apps/menu
    cmds:
      - pnpm typecheck

  menu:test:
    desc: "Misafir QR menü uygulaması testleri (vitest — sepet, modifier, para, hata eşleme)"
    dir: web
    cmds:
      - pnpm --filter @onlinemenu/menu test:run

  pos:dev:
    desc: "POS desktop dev (Wails)"
    dir: web/apps/pos-desktop
    cmds:
      # CGO_LDFLAGS workaround: Wails' internal `-tags dev` build (used by
      # `wails dev` for its devserver/live-reload asset path) references
      # UTType without linking UniformTypeIdentifiers on newer macOS SDKs
      # (reproduced on Xcode 16 / macOS 14.6.1 with Wails v2.11.0, including
      # on an unmodified `wails init` template — not specific to this app).
      # Harmless no-op on non-darwin hosts.
      - |
        if [ "$(go env GOOS)" = "darwin" ]; then
          export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
        fi
        wails dev

  pos:build:
    desc: "POS desktop production build"
    dir: web/apps/pos-desktop
    cmds:
      - wails build

  pos:test:
    desc: "POS desktop Go testleri (race + cover)"
    dir: web/apps/pos-desktop
    cmds:
      - go build ./...
      - go vet ./...
      # live_smoke_test.go is behind the `live` tag; vet it here so it cannot rot unnoticed.
      - go vet -tags live ./...
      - go test -race -cover ./...

  pos:test:web:
    desc: "POS desktop frontend testleri (vitest — lib/fiscalStatus para aritmetiği)"
    dir: web
    cmds:
      - pnpm --filter @onlinemenu/pos-desktop test:run

  pos:test:live:
    desc: "POS desktop Go katmanı canlı smoke (çalışan dev API; POS_LIVE_API_URL, varsayılan http://localhost:8081). Dev DB'ye SMOKE-* kayıtları yazar — prod'a yöneltme"
    dir: web/apps/pos-desktop
    cmds:
      - POS_LIVE_API_URL="${POS_LIVE_API_URL:-http://localhost:8081}" go test -tags live -run TestLiveSmoke -count=1 -v .

  pos:typecheck:
    desc: "POS desktop frontend tip denetimi (tsc --noEmit)"
    dir: web
    cmds:
      - pnpm --filter @onlinemenu/pos-desktop typecheck

  pos:lint:
    desc: "POS desktop frontend eslint"
    dir: web
    cmds:
      - pnpm --filter @onlinemenu/pos-desktop lint

  pos:generate:
    desc: "POS desktop Wails binding'lerini üret (frontend/wailsjs, commit edilmez)"
    dir: web/apps/pos-desktop
    cmds:
      - wails generate module

  deploy:sync:
    desc: "Repo'yu prod sunucusuna rsync ile gönder (deploy/scripts/sync.sh, DEPLOY_HOST/DEPLOY_DIR)"
    cmds:
      - bash deploy/scripts/sync.sh

  deploy:secrets:encrypt:
    desc: "deploy/.env.prod'u SOPS ile şifrele → deploy/.env.prod.sops, düz metni sil"
    cmds:
      - |
        if [ ! -f deploy/.env.prod ]; then
          echo "HATA: deploy/.env.prod yok — önce 'cp deploy/.env.prod.example deploy/.env.prod' ile oluşturup gerçek değerleri doldurun." >&2
          exit 1
        fi
        # .sops uzantısından dosya tipi çıkarılamıyor ve .sops.yaml'ın
        # creation_rules'undaki input_type/output_type alanları geçersiz —
        # tip her çağrıda açıkça verilmeli.
        sops -e --input-type dotenv --output-type dotenv deploy/.env.prod > deploy/.env.prod.sops
        rm deploy/.env.prod

  deploy:secrets:edit:
    desc: "deploy/.env.prod.sops'u yerinde (şifreli) düzenle"
    cmds:
      - sops --input-type dotenv --output-type dotenv deploy/.env.prod.sops

  deploy:secrets:updatekeys:
    desc: "deploy/.env.prod.sops age alıcılarını .sops.yaml ile senkronize et"
    cmds:
      # `sops updatekeys` --output-type BAYRAĞINI TANIMIYOR (yalnız --input-type
      # var) — eklenirse sessizce "dosya adı" sanılıp dosya bulunamadı hatası
      # verir (test edildi: 3 sahte dosya denemesi). Yalnızca --input-type.
      - sops updatekeys --input-type dotenv -y deploy/.env.prod.sops

  deploy:ssh:
    desc: "Prod sunucusuna SSH bağlan (DEPLOY_HOST, varsayılan: diverserver)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
    cmds:
      - ssh {{.DEPLOY_HOST}}

  deploy:build:api:
    desc: "Sunucuda API imajını ko ile yerel Docker daemon'a derle (deploy/scripts/build-api.sh)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/build-api.sh'

  deploy:build:web:
    desc: "Sunucuda menu + admin imajlarını kaynaktan derle (docker compose build)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/compose.sh build menu admin'

  deploy:migrate:
    desc: "Sunucuda tüm modül migration'larını uygula (app_migrator, Postgres 127.0.0.1:5433)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/migrate.sh up'

  deploy:up:
    desc: "Sunucuda tüm stack'i ayağa kaldır (docker compose up -d, prod + diverserver katmanı)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/compose.sh up -d'

  deploy:ps:
    desc: "Sunucuda servis durumunu göster (docker compose ps)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/compose.sh ps'

  deploy:logs:
    desc: "Sunucuda servis loglarını izle (CLI_ARGS ile servis adı, ör: task deploy:logs -- api)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh -t {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/compose.sh logs -f {{.CLI_ARGS}}'

  deploy:compose:
    desc: "Sunucuda genel docker compose sarmalayıcısı (CLI_ARGS geçişli, ör: task deploy:compose -- restart api)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh -t {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/compose.sh {{.CLI_ARGS}}'

  deploy:keycloak:harden:
    desc: "Sunucuda Keycloak sertleştirme (dev artefaktlarını sil, admin-api secret → Vault, ilk yönetici; FIRST_ADMIN_EMAIL/FIRST_ADMIN_NAME opsiyonel)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && FIRST_ADMIN_EMAIL="{{.FIRST_ADMIN_EMAIL}}" FIRST_ADMIN_NAME="{{.FIRST_ADMIN_NAME}}" deploy/scripts/keycloak-harden.sh'

  deploy:offsite-backup:
    desc: "Sunucuda Postgres dump'larını Google Drive'a (rclone gdrive:onlinemenu-backups) kopyala — cron 03:45'te zaten koşuyor"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && deploy/scripts/offsite-backup.sh'

  deploy:reset-test-data:
    desc: "Sunucuda bir tenant'ın işlem verisini (adisyon/sipariş/ödeme/kasa) SİL — pilot öncesi; TENANT_SLUG ve CONFIRM=yes-wipe-<slug> zorunlu"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    requires:
      vars: [TENANT_SLUG, CONFIRM]
    cmds:
      - ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} && TENANT_SLUG="{{.TENANT_SLUG}}" CONFIRM="{{.CONFIRM}}" deploy/scripts/reset-test-data.sh'

  deploy:seed:first-tenant:
    desc: "Sunucuda ilk pilot tenant + şube + yönetici üyeliğini seed'le (FIRST_ADMIN_SUB, FIRST_ADMIN_EMAIL, FIRST_ADMIN_NAME, TENANT_NAME, TENANT_SLUG, BRANCH_NAME gerekli)"
    vars:
      DEPLOY_HOST:
        sh: echo "${DEPLOY_HOST:-diverserver}"
      DEPLOY_DIR:
        sh: echo "${DEPLOY_DIR:-/opt/onlinemenu}"
    requires:
      vars: [FIRST_ADMIN_SUB, FIRST_ADMIN_EMAIL, FIRST_ADMIN_NAME, TENANT_NAME, TENANT_SLUG, BRANCH_NAME]
    cmds:
      # Değerler tek tırnak İÇERMEMELİ (dış komut ssh argümanını tek tırnakla
      # taşıyor; çift tırnak sunucudaki bash'e olduğu gibi ulaşır).
      - >-
        ssh {{.DEPLOY_HOST}} 'cd {{.DEPLOY_DIR}} &&
        FIRST_ADMIN_SUB="{{.FIRST_ADMIN_SUB}}"
        FIRST_ADMIN_EMAIL="{{.FIRST_ADMIN_EMAIL}}"
        FIRST_ADMIN_NAME="{{.FIRST_ADMIN_NAME}}"
        TENANT_NAME="{{.TENANT_NAME}}"
        TENANT_SLUG="{{.TENANT_SLUG}}"
        BRANCH_NAME="{{.BRANCH_NAME}}"
        deploy/scripts/seed-first-tenant.sh'

  deploy:release:
    desc: "Tam yayın akışı: sync → build:api → build:web → migrate → up → smoke"
    vars:
      API_URL:
        sh: echo "${API_URL:-https://api.diverstreetfood.com}"
      ADMIN_URL:
        sh: echo "${ADMIN_URL:-https://pos.diverstreetfood.com}"
      MENU_URL:
        sh: echo "${MENU_URL:-https://menu.diverstreetfood.com}"
    cmds:
      - task: deploy:sync
      - task: deploy:build:api
      - task: deploy:build:web
      - task: deploy:migrate
      - task: deploy:up
      - cmd: API_URL={{.API_URL}} ADMIN_URL={{.ADMIN_URL}} MENU_URL={{.MENU_URL}} task deploy:smoke

  deploy:smoke:
    desc: "Prod deploy sonrası /healthz, /readyz, admin ve menu uçlarını doğrula (API_URL, ADMIN_URL, MENU_URL gerekli)"
    cmds:
      - bash deploy/smoke.sh

  ci:
    desc: "CI pipeline lokalde simüle et"
    cmds:
      - task: backend:ci

  clean:
    desc: "Tüm build artifact'larını sil"
    cmds:
      - task: backend:clean
