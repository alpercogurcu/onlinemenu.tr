version: 3
workdir: .

allow:
  depOnAnyVendor: true
  ignoreNotFoundComponents: true

# Composition root files: cmd/ binaries and module.go wiring are excluded from
# boundary checks because they legitimately import across all modules.
excludeFiles:
  - "cmd/.*"
  - "internal/modules/[^/]+/module(_test)?\\.go"
  - "internal/e2e/.*"
  # Full-stack integration tests: these wire a real DB + the module's own lower
  # layers to exercise an HTTP/WS surface end to end, so they legitimately
  # import repo/mock packages their production layer must never touch.
  # Excluded per FILE (never a blanket "_test\.go" pattern) so the production
  # boundary they are testing stays fully enforced.
  - "internal/modules/inventory/http/branch_authz_integration_test\\.go"
  - "internal/modules/inventory/http/supply_policy_visibility_test\\.go"
  - "internal/modules/billing/service/integration_test\\.go"
  - "internal/modules/pos/ws/hub_test\\.go"
  - "internal/modules/identity/repo/role_tenant_guard_test\\.go"

# Sub-layer granularity enforces cross-module boundary: modules may only import
# the public/ interface of other modules, never domain/, repo/, or service/.
components:
  platform: { in: "internal/platform/**" }

  # Catalog
  catalog_domain:   { in: "internal/modules/catalog/domain/**" }
  catalog_repo:     { in: "internal/modules/catalog/repo/**" }
  catalog_service:  { in: "internal/modules/catalog/service/**" }
  catalog_http:     { in: "internal/modules/catalog/http/**" }
  catalog_public:   { in: "internal/modules/catalog/public/**" }
  catalog_events:   { in: "internal/modules/catalog/events/**" }

  # Identity
  identity_domain:  { in: "internal/modules/identity/domain/**" }
  identity_repo:    { in: "internal/modules/identity/repo/**" }
  identity_service: { in: "internal/modules/identity/service/**" }
  identity_http:    { in: "internal/modules/identity/http/**" }
  identity_public:  { in: "internal/modules/identity/public/**" }
  identity_events:  { in: "internal/modules/identity/events/**" }

  # Tenant
  tenant_repo:     { in: "internal/modules/tenant/repo/**" }
  tenant_service:  { in: "internal/modules/tenant/service/**" }
  tenant_http:     { in: "internal/modules/tenant/http/**" }
  tenant_public:   { in: "internal/modules/tenant/public/**" }
  tenant_events:   { in: "internal/modules/tenant/events/**" }

  # POS
  pos_domain:    { in: "internal/modules/pos/domain/**" }
  pos_repo:      { in: "internal/modules/pos/repo/**" }
  pos_service:   { in: "internal/modules/pos/service/**" }
  pos_http:      { in: "internal/modules/pos/http/**" }
  pos_public:    { in: "internal/modules/pos/public/**" }
  pos_events:    { in: "internal/modules/pos/events/**" }
  pos_ws:        { in: "internal/modules/pos/ws/**" }

  # Storefront (public QR dine-in surface — ADR-ARCH-006)
  storefront_domain:  { in: "internal/modules/storefront/domain/**" }
  storefront_repo:    { in: "internal/modules/storefront/repo/**" }
  storefront_service: { in: "internal/modules/storefront/service/**" }
  storefront_http:    { in: "internal/modules/storefront/http/**" }
  storefront_public:  { in: "internal/modules/storefront/public/**" }

  # Payment
  payment_domain:   { in: "internal/modules/payment/domain/**" }
  payment_repo:     { in: "internal/modules/payment/repo/**" }
  payment_service:  { in: "internal/modules/payment/service/**" }
  payment_http:     { in: "internal/modules/payment/http/**" }
  payment_public:   { in: "internal/modules/payment/public/**" }
  payment_fiscal:   { in: "internal/modules/payment/fiscal/**" }

  # Inventory
  inventory_domain:   { in: "internal/modules/inventory/domain/**" }
  inventory_repo:     { in: "internal/modules/inventory/repo/**" }
  inventory_service:  { in: "internal/modules/inventory/service/**" }
  inventory_http:     { in: "internal/modules/inventory/http/**" }
  inventory_public:   { in: "internal/modules/inventory/public/**" }

  # Billing
  billing_domain:   { in: "internal/modules/billing/domain/**" }
  billing_repo:     { in: "internal/modules/billing/repo/**" }
  billing_service:  { in: "internal/modules/billing/service/**" }
  billing_http:     { in: "internal/modules/billing/http/**" }
  billing_public:   { in: "internal/modules/billing/public/**" }
  billing_adapter:  { in: "internal/modules/billing/adapter/**" }

  # HR-Core
  hrcore_domain:   { in: "internal/modules/hr-core/domain/**" }
  hrcore_repo:     { in: "internal/modules/hr-core/repo/**" }
  hrcore_service:  { in: "internal/modules/hr-core/service/**" }
  hrcore_http:     { in: "internal/modules/hr-core/http/**" }
  hrcore_public:   { in: "internal/modules/hr-core/public/**" }

  # Party
  party_domain:    { in: "internal/modules/party/domain/**" }
  party_repo:      { in: "internal/modules/party/repo/**" }
  party_service:   { in: "internal/modules/party/service/**" }
  party_http:      { in: "internal/modules/party/http/**" }
  party_public:    { in: "internal/modules/party/public/**" }

  # Notification
  notification_public: { in: "internal/modules/notification/public/**" }

  # Manufacturing
  manufacturing_public: { in: "internal/modules/manufacturing/public/**" }

  # Platform integration
  platform_integration: { in: "internal/platform/integration/**" }

  # Edge SQLite platform helper
  edgedb: { in: "internal/platform/edgedb/**" }

  # Edge-sync module (local server — no cloud imports allowed)
  edgesync_domain:  { in: "internal/modules/edge-sync/domain/**" }
  edgesync_outbox:  { in: "internal/modules/edge-sync/outbox/**" }
  edgesync_sync:    { in: "internal/modules/edge-sync/sync/**" }

deps:
  # Platform is unrestricted — it is the foundation all modules build on.
  platform:
    anyProjectDeps: true

  # --- Catalog ---
  # Self-reference allows black-box test files (package domain_test) to compile.
  catalog_domain:
    mayDependOn: [platform, catalog_domain]
  catalog_repo:
    mayDependOn: [platform, catalog_domain, catalog_repo]
  catalog_service:
    mayDependOn: [platform, catalog_domain, catalog_repo, catalog_public, catalog_service]
  catalog_http:
    mayDependOn: [platform, catalog_domain, catalog_service, catalog_public, catalog_http]
  catalog_public:
    mayDependOn: [platform, catalog_public]
  catalog_events:
    mayDependOn: [platform, catalog_public, catalog_events]

  # --- Identity ---
  identity_domain:
    mayDependOn: [platform, identity_domain]
  identity_repo:
    # Repos return identity_public types directly (no separate domain DTOs).
    mayDependOn: [platform, identity_domain, identity_public, identity_repo]
  identity_service:
    mayDependOn: [platform, identity_domain, identity_repo, identity_public, identity_service]
  identity_http:
    mayDependOn: [platform, identity_domain, identity_service, identity_public, identity_http]
  identity_public:
    mayDependOn: [platform, identity_public]
  identity_events:
    # Subscriber creates repo records when tenant events arrive.
    mayDependOn: [platform, identity_public, identity_repo, identity_events]

  # --- Tenant ---
  tenant_repo:
    mayDependOn: [platform, tenant_public, tenant_repo]
  tenant_service:
    mayDependOn: [platform, tenant_repo, tenant_public, tenant_events, tenant_service]
  tenant_http:
    mayDependOn: [platform, tenant_service, tenant_public, tenant_http]
  tenant_public:
    mayDependOn: [platform, tenant_public]
  tenant_events:
    mayDependOn: [platform, tenant_public, tenant_events]

  # --- POS ---
  # pos may use catalog_public and payment_public; never their internal layers.
  pos_domain:
    mayDependOn: [platform, catalog_public, pos_domain]
  pos_repo:
    mayDependOn: [platform, pos_domain, pos_repo]
  pos_service:
    mayDependOn: [platform, pos_domain, pos_repo, pos_public, catalog_public, payment_public, pos_service]
  pos_http:
    mayDependOn: [platform, pos_domain, pos_service, pos_public, catalog_public, pos_http]
  pos_public:
    # pos_public exposes types built from pos_domain aggregates.
    mayDependOn: [platform, pos_domain, pos_public]
  pos_events:
    mayDependOn: [platform, pos_public, pos_events]
  # ws.Hub is the kitchen WebSocket fan-out: it subscribes to pos's own NATS
  # events via platform/eventbus and reads order/check state via pos_service
  # (in-module — not cross-module — so pos_service, not just pos_public, is
  # allowed here) to build routing + snapshot data. Self-reference (pos_ws)
  # allows black-box test files (package ws_test) to compile, matching the
  # convention used by every other module's *_test.go (see e.g. pos_domain).
  pos_ws:
    mayDependOn: [platform, pos_domain, pos_service, pos_public, pos_ws]

  # --- Storefront ---
  # storefront is the customer-facing surface: it owns QR codes and guest
  # session/order bookkeeping, and reaches the menu and the order machine only
  # through catalog_public / pos_public — it never writes a pos row itself.
  storefront_domain:
    mayDependOn: [platform, storefront_domain]
  storefront_repo:
    mayDependOn: [platform, storefront_domain, storefront_repo]
  storefront_service:
    mayDependOn: [platform, storefront_domain, storefront_repo, storefront_public,
                  catalog_public, pos_public, storefront_service]
  storefront_http:
    mayDependOn: [platform, storefront_domain, storefront_service, storefront_public,
                  catalog_public, pos_public, storefront_http]
  storefront_public:
    mayDependOn: [platform, storefront_public]

  # --- Payment ---
  # payment must NOT import any pos or billing internals.
  payment_domain:
    mayDependOn: [platform, payment_domain]
  payment_repo:
    mayDependOn: [platform, payment_domain, payment_repo]
  # identity_public added for ADR-DATA-008 PIN akışı: CashSessionPinService
  # (Join/Switch/ResetPin) drives identity's pub.CashierPinService (PIN
  # storage/verification) and pub.MembershipResolver (role lookup for the
  # PIN-switched token). Direction is one-way — identity_service does NOT
  # depend on payment_public — so this is a new edge, not a cycle.
  payment_service:
    mayDependOn: [platform, payment_domain, payment_repo, payment_public, notification_public, identity_public, payment_service]
  # payment_fiscal is allowed here for ONE reason: the TokenX webhook endpoint
  # is definitionally the vendor's inbound edge, so the transport layer must
  # speak the vendor's wire format (tokenx.ParseWebhook / ParseLockEvent) to
  # normalize a delivery before handing it to domain.FiscalResultSink. This is
  # an in-module transport<->adapter edge and does NOT weaken the rules that
  # matter: payment_http still may not reach payment_repo, and no cross-module
  # internals are reachable from here.
  payment_http:
    mayDependOn: [platform, payment_domain, payment_service, payment_public, payment_http, payment_fiscal]
  payment_public:
    mayDependOn: [platform, payment_public]
  # tokenx is the Token X Connect Cloud device adapter (ADR-FISCAL-002). As an
  # adapter it implements ports declared in payment_domain and speaks the
  # vendor wire format; it must never reach into repo, service or http.
  payment_fiscal:
    mayDependOn: [platform, payment_domain, payment_fiscal]

  # --- Inventory ---
  # inventory is independent; other modules may consume inventory_public (e.g. pos for stock checks).
  inventory_domain:
    mayDependOn: [platform, inventory_domain]
  inventory_repo:
    mayDependOn: [platform, inventory_domain, inventory_repo]
  inventory_service:
    mayDependOn: [platform, inventory_domain, inventory_repo, inventory_public, inventory_service]
  inventory_http:
    mayDependOn: [platform, inventory_domain, inventory_service, inventory_public, inventory_http]
  inventory_public:
    mayDependOn: [platform, inventory_public]

  # --- Billing ---
  # billing adapters may use platform/integration for ProviderConfig scaffolding.
  billing_domain:
    mayDependOn: [platform, billing_domain]
  billing_adapter:
    mayDependOn: [platform, billing_domain, platform_integration, billing_adapter]
  billing_repo:
    mayDependOn: [platform, billing_domain, billing_repo]
  billing_service:
    mayDependOn: [platform, billing_domain, billing_repo, billing_public, billing_service]
  billing_http:
    mayDependOn: [platform, billing_domain, billing_service, billing_public, billing_http]
  billing_public:
    mayDependOn: [platform, billing_domain, billing_public]

  # --- HR-Core ---
  hrcore_domain:
    mayDependOn: [platform, hrcore_domain]
  hrcore_repo:
    mayDependOn: [platform, hrcore_domain, hrcore_repo]
  hrcore_service:
    mayDependOn: [platform, hrcore_domain, hrcore_repo, hrcore_public, hrcore_service]
  hrcore_http:
    mayDependOn: [platform, hrcore_domain, hrcore_service, hrcore_public, hrcore_http]
  hrcore_public:
    mayDependOn: [platform, hrcore_public]

  # --- Party ---
  party_domain:
    mayDependOn: [platform, party_domain]
  party_repo:
    mayDependOn: [platform, party_domain, party_repo]
  party_service:
    mayDependOn: [platform, party_domain, party_repo, party_public, party_service]
  party_http:
    mayDependOn: [platform, party_domain, party_service, party_public, party_http]
  party_public:
    mayDependOn: [platform, party_domain, party_public]

  # --- Platform Integration ---
  platform_integration:
    mayDependOn: [platform]

  # --- Edge SQLite ---
  # edgedb is a platform-level helper; no cloud module imports allowed.
  edgedb:
    mayDependOn: [platform]

  # --- Edge-Sync ---
  # edge-sync packages must NOT import any cloud module (postgres, vault, OPA, etc.).
  # They may import edgedb and each other's lower layers.
  # edgesync_domain is intentionally OMITTED here (not just "mayDependOn: []"):
  # go-arch-lint's schema validator rejects an explicit empty mayDependOn list
  # ("should have ref in 'mayDependOn'/'canUse' or at least one flag of
  # ['anyProjectDeps', 'anyVendorDeps']"), but a component absent from `deps:`
  # still defaults to zero allowed project/vendor deps — same "depends on
  # nothing" enforcement, without tripping that validator. Verified by
  # temporarily adding a platform import to edge-sync/domain: still flagged.
  edgesync_outbox:
    mayDependOn: [edgesync_domain, edgesync_outbox]
  edgesync_sync:
    mayDependOn: [edgesync_domain, edgesync_outbox, edgesync_sync]
