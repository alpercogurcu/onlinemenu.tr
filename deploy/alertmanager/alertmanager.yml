# =============================================================================
# Alertmanager — Prod Configuration
#
# ⚠️ Alertmanager env değişkenlerini GENİŞLETMEZ (Prometheus'un aksine): bu
# dosyadaki smtp_smarthost/smtp_from/receivers.to gibi alanlar "${VAR}" yazsa
# bile olduğu gibi kalır. Bu yüzden host/from/alıcı adresi KURULUM SIRASINDA
# elle bu dosyada düzenlenir (bkz. docker-compose.prod.yml kurulum sırası,
# R3). Yalnızca parola dosya üzerinden okunur (smtp_auth_password_file) —
# smtp_password bu dizinde KURULUM SIRASINDA oluşturulur, git'e gitmez (bkz.
# .gitignore ve smtp_password.example).
# =============================================================================

global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  receiver: ops-email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ops-email
    email_configs:
      - to: 'ops@example.com'
        send_resolved: true

  # Opsiyonel webhook alıcısı — ihtiyaç doğarsa route.receiver'ı buna
  # çevirip aşağıyı yorumdan çıkarın (ör. Slack/PagerDuty uyumlu bir HTTP
  # köprüsü):
  # - name: ops-webhook
  #   webhook_configs:
  #     - url: 'https://DEGISTIR/alertmanager-webhook'
  #       send_resolved: true
