# ---------------------------------------------------------------------------
# api.diverstreetfood.com — Go API (onlinemenu-api:8080), POS/KDS WebSocket
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.diverstreetfood.com;

    ssl_certificate /etc/letsencrypt/live/pos.diverstreetfood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.diverstreetfood.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_status 429;

    # KDS/POS WebSocket: uzun ömürlü tek bağlantı, hız sınırı dışında (yeniden
    # bağlanma fırtınası dahil; kimlik doğrulama API tarafında).
    location ^~ /api/v1/pos/ws/ {
        set $upstream http://onlinemenu-api:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        limit_req zone=om_api burst=100 nodelay;

        set $upstream http://onlinemenu-api:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        # WS uçları (ör. /api/v1/pos/ws) ayrı location yerine tüm API'de
        # Upgrade iletilerek desteklenir (basitlik tercihi); read timeout bu
        # yüzden WS'in kopmaması için 3600s'e çekilmiştir.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

# ---------------------------------------------------------------------------
# grafana.diverstreetfood.com — Grafana (onlinemenu-grafana:3000)
# observability profili kapalıyken bu servis ayakta değildir; resolver +
# değişkenli proxy_pass sayesinde nginx yine de başlar (502 döner, bkz. dosya
# başlığı). Admin vhost'undan (pos.) türetildi: Grafana Live (canlı
# dashboard/alert güncellemeleri) WebSocket kullanır, aynı Upgrade/Connection
# başlıkları ve uzun read timeout gerekir. api. vhost'undaki `limit_req`
# BİLEREK taşınmadı — dashboard panel yüklemesi tek sayfada onlarca istek atar.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.diverstreetfood.com;

    ssl_certificate /etc/letsencrypt/live/pos.diverstreetfood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.diverstreetfood.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://onlinemenu-grafana:3000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        # Grafana Live (WebSocket) için zorunlu; SSE benzeri canlı paneller de
        # aynı location üzerinden akar.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

# ---------------------------------------------------------------------------
# auth.diverstreetfood.com — Keycloak 26 (onlinemenu-keycloak:8080)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name auth.diverstreetfood.com;

    ssl_certificate /etc/letsencrypt/live/pos.diverstreetfood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.diverstreetfood.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    # Keycloak 26 büyük auth/logout başlıkları (çoklu realm/client, uzun
    # JWT/cookie) üretir; varsayılan proxy_buffer boyutları 502 üretebilir.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_status 429;

    # Brute-force yüzeyi: parola formu gönderimi — düşük limit (token ucu om_auth grubunda).
    location ~ ^/realms/[^/]+/login-actions/ {
        limit_req zone=om_auth_login burst=20 nodelay;

        set $upstream http://onlinemenu-keycloak:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        limit_req zone=om_auth burst=100 nodelay;

        set $upstream http://onlinemenu-keycloak:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
