# =============================================================================
# Online Menu — Diver Street Food sunucusu vhost'ları (b2b_nginx içine include
# edilir, bkz. deploy/nginx/README.md). Bu dosya YALNIZCA server{} blokları
# içerir; events{}/http{} onlinemenu.b2b/nginx/nginx.conf'ta tanımlı.
#
# Tek Let's Encrypt sertifikası, beş SAN: pos/menu/api/auth/grafana.diverstreetfood.com
# (dizin: /etc/letsencrypt/live/pos.diverstreetfood.com/). Sertifika grafana
# eklenene kadar dört SAN'lıdır — bkz. deploy/nginx/README.md certbot komutu.
#
# Upstream'ler `set $upstream ...; proxy_pass $upstream;` ile DEĞİŞKEN olarak
# verilir (sabit proxy_pass değil). Neden: nginx başlarken proxy_pass hedefini
# DNS ile hemen çözer; Online Menu konteynerleri henüz ayakta değilse (veya
# yeniden başlıyorsa) çözüm başarısız olur ve TÜM b2b_nginx (b2b dahil) ayağa
# kalkamaz. `resolver` + değişken kullanımı çözümü istek anına erteler, böylece
# b2b_nginx Online Menu'den bağımsız açılabilir.
# =============================================================================

# ---------------------------------------------------------------------------
# Hız sınırı bölgeleri (http bağlamı — bu dosya http{} içinde include edilir).
# b2b'nin `zone=api` (10 r/s) bölgesinden BAĞIMSIZ; b2b vhost'ları bunlara
# dokunmaz, biz de b2b bölgesini kullanmayız. Anahtar IP'dir: bir şubenin tüm
# cihazları (garson telefonları, POS, KDS, QR misafirleri) tek NAT IP'sidir.
# `limit_req_status 429` http'de DEĞİL server bloklarında verilir; aksi halde
# b2b'nin 503 davranışı da değişirdi. Bkz. docs/deployment.md §4.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=om_api:10m        rate=50r/s;
limit_req_zone $binary_remote_addr zone=om_web:10m        rate=100r/s;
limit_req_zone $binary_remote_addr zone=om_auth:10m       rate=50r/s;
limit_req_zone $binary_remote_addr zone=om_auth_login:10m rate=10r/s;

# ---------------------------------------------------------------------------
# HTTP (80) — ACME doğrulama + HTTPS'e yönlendirme, dört alan adı için ortak
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name pos.diverstreetfood.com menu.diverstreetfood.com api.diverstreetfood.com auth.diverstreetfood.com grafana.diverstreetfood.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# pos.diverstreetfood.com — Admin paneli (Next.js, onlinemenu-admin:3000)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name pos.diverstreetfood.com;

    ssl_certificate /etc/letsencrypt/live/pos.diverstreetfood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.diverstreetfood.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_status 429;

    location / {
        limit_req zone=om_web burst=200 nodelay;

        set $upstream http://onlinemenu-admin:3000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        # Admin'de WS/SSE proxy route'u var (bkz. görev tanımı); Upgrade
        # başlıkları ve uzun read timeout bu yüzden tüm location'a uygulanır.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_read_timeout 3600s;
        # SSE akışının nginx'te birikmemesi için; WS'i etkilemez — 101
        # sonrası nginx zaten ham tünele geçer.
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

